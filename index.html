<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blockchain Demo Frontend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
        }
    </style>
</head>
<body>

    <h2>Local Testnet Transfer</h2>
    
    <div class="form-group">
        <label for="walletSelect">Select Target Environment:</label>
        <select id="walletSelect">
            <option value="hardhat">Localhost (Hardhat Node)</option>
            <option value="custom">Custom RPC Network</option>
        </select>
    </div>

    <div class="form-group">
        <label for="address">Recipient Address:</label>
        <input type="text" id="address" placeholder="0x..." required>
    </div>

    <div class="form-group">
        <label for="amount">Amount (Test ETH):</label>
        <input type="number" id="amount" step="0.01" placeholder="0.1" required>
    </div>

    <button onclick="sendTestTransaction()">Execute Transfer</button>

    <div id="status">Status: Ready to connect</div>

    <!-- Load the Ethers.js library safely via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script>
        async function sendTestTransaction() {
            const statusDiv = document.getElementById('status');
            const recipient = document.getElementById('address').value;
            const amount = document.getElementById('amount').value;

            // 1. Verify that a browser wallet like MetaMask is installed
            if (!window.ethereum) {
                statusDiv.innerText = "Error: Please open this page inside a Web3-enabled browser or MetaMask app.";
                return;
            }

            if (!recipient || !amount) {
                statusDiv.innerText = "Error: Please fill in all fields.";
                return;
            }

            try {
                statusDiv.innerText = "Connecting to wallet...";
                
                // 2. Request connection to the user's wallet
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();

                statusDiv.innerText = "Sending transaction to the local block...";

                // 3. Format and dispatch the standard transaction object
                const tx = await signer.sendTransaction({
                    to: recipient,
                    value: ethers.parseEther(amount)
                });

                statusDiv.innerText = `Pending Confirmation... Tx Hash: ${tx.hash}`;

                // 4. Wait for the Hardhat node to mine the block
                await tx.wait();
                statusDiv.innerText = `Success! Transaction confirmed on local network.`;
                
            } catch (error) {
                console.error(error);
                statusDiv.innerText = `Transaction Failed: ${error.message}`;
            }
        }
    </script>
</body>
</html>
